<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full JavaScript Program</title>

  <!-- Example of adding a JS library (optional) -->
  <!-- jQuery library (like a header file in C++) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h2>JavaScript Example Program</h2>
  <p id="output"></p>

  <script>
    // =========================
    // HEADER / GLOBAL VARIABLES
    // =========================
    let name = "Pavan";
    let age = 21;
    const country = "India";

    // =========================
    // FUNCTIONS
    // =========================
    function greet(person) {
      return "Hello, " + person + "!";
    }

    function add(a, b) {
      return a + b;
    }

    // =========================
    // MAIN FUNCTION
    // =========================
    function main() {
      console.log("=== JavaScript Program Start ===");

      console.log(greet(name));
      console.log("Age:", age);
      console.log("Country:", country);

      console.log("Addition:", add(10, 20));

      // Display output on web page
      document.getElementById("output").innerHTML = `
        ${greet(name)}<br>
        Age: ${age}<br>
        Country: ${country}<br>
        10 + 20 = ${add(10, 20)}
      `;
    }

    // =========================
    // PROGRAM START
    // =========================
    main();  // equivalent to main() in C or Java

  </script>
</body>
</html>
